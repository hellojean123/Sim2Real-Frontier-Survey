name: Capture original paper figures

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/capture_paper_figures.py'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pymupdf pillow requests
      - name: Render figures from source PDFs
        run: python scripts/capture_paper_figures.py
      - name: Publish figure screenshot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/paper-screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "figures: capture original Figure 1 and method architecture screenshots"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
